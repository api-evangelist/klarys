aid: klarys
name: Klarys
description: 'Klarys — formerly ProcSea, renamed in 2023 — is a French SaaS eProcurement platform built
  for the fresh-food supply chain: seafood, fruit and vegetables, meat and dairy. It connects retail, wholesale
  and foodservice buyers with their suppliers, wholesalers and mareyeurs through a standardized fresh-food
  product catalog, a supplier sales interface, a centralized purchasing interface, a central purchasing module
  for store networks, a supplier invoicing module and a business-intelligence module. Klarys states that the
  platform "integrates with all your business systems and applications via API and EDI" — ERP, accounting
  tools and product reference systems. Founded in 2016 in Rennes, France with operations in Switzerland, it
  is a Serena portfolio company, a member of the SAP.iO acceleration program and listed on the SAP Store. The
  tenant application runs at klarys.app and publishes an RFC 8414 OAuth 2.0 authorization-server metadata
  document anonymously — including mcp:read and mcp:write scopes — but no public API reference, OpenAPI, or
  developer portal: the schema endpoint requires an authenticated tenant account.'
