apis:
- name: Klarys Platform API
  description: 'The API surface behind the Klarys tenant application at klarys.app. Klarys markets API and
    EDI integration with customer ERP, accounting and product-reference systems, and the application serves
    an anonymous RFC 8414 OAuth 2.0 authorization-server metadata document at
    https://klarys.app/.well-known/oauth-authorization-server (issuer https://klarys.app/api/public/o) with
    authorization_code, client_credentials and refresh_token grants, PKCE S256, dynamic client registration,
    token revocation and introspection. No public API reference, OpenAPI document or developer portal was
    found: the schema endpoint at https://klarys.app/api/schema/ returns HTTP 401
    {"code":1003,"error":"User is unauthenticated"}, so the contract is customer-gated.'
  humanURL: https://www.klarys.io/en/solutions
  baseURL: https://klarys.app/api/
  tags:
  - eProcurement
  - Supply Chain
  - Fresh Food
